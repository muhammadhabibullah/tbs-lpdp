<!-- Adaptive-icon background layer (Android 8+): the favicon's navy gradient with
     no rounding and no mark. The launcher supplies the shape — circle, squircle,
     teardrop — by masking this square, so any corner radius baked in here would
     show up as a dark notch inside the mask. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2280" />
      <stop offset="1" stop-color="#1b3fb5" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#bg)" />
</svg>
