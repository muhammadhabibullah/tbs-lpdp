<!-- The masthead brand mark (components/AppShell.tsx) as a tab icon: same
     mortarboard geometry, scaled 1.45× to fill the navy tile so it still reads
     at 16px. The emblem's faint disc and thin ring are dropped — at tab size a
     0.5px stroke is mud, and on a solid tile they carried nothing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2280" />
      <stop offset="1" stop-color="#1b3fb5" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="10" fill="url(#bg)" />
  <g transform="translate(0 -1.2)">
    <path d="M6.6 19.65 24 10.95l17.4 8.7-17.4 8.7-17.4-8.7Z" fill="#fff" />
    <path
      d="M13.85 24.73V32.7c0 2.9 5.08 5.08 10.15 5.08s10.15-2.18 10.15-5.08v-7.97"
      fill="none"
      stroke="#fff"
      stroke-width="3.2"
      stroke-linecap="round"
    />
  </g>
</svg>
