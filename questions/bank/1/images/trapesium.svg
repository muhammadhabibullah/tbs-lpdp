<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240">
  <!-- 1-kuantitatif-025: trapesium sama kaki, sisi sejajar 32 cm dan 20 cm, kaki 10 cm.
       Skala 9 px per cm (alas 288, sisi atas 180, tinggi 72).
       PENTING: tinggi (8 cm) dan proyeksi kaki (6 cm) TIDAK dilabeli — keduanya
       adalah langkah penyelesaian, bukan besaran yang diketahui. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .dim  { font-size: 14px; font-weight: 600; fill: #3f4650; }
    .tick { stroke: #6b7280; stroke-width: 1; }
  </style>

  <polygon points="66,190 354,190 300,118 120,118"
           fill="#d6e4fa" stroke="#1a5fb4" stroke-width="2"/>

  <!-- tanda kaki sama panjang -->
  <line x1="88" y1="158" x2="98" y2="150" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="322" y1="150" x2="332" y2="158" stroke="#1a5fb4" stroke-width="2"/>

  <!-- sisi sejajar 32 cm -->
  <line class="tick" x1="66" y1="206" x2="354" y2="206"/>
  <line class="tick" x1="66" y1="200" x2="66" y2="212"/>
  <line class="tick" x1="354" y1="200" x2="354" y2="212"/>
  <text class="dim" x="210" y="228" text-anchor="middle">32 cm</text>

  <!-- sisi sejajar 20 cm -->
  <line class="tick" x1="120" y1="102" x2="300" y2="102"/>
  <line class="tick" x1="120" y1="96" x2="120" y2="108"/>
  <line class="tick" x1="300" y1="96" x2="300" y2="108"/>
  <text class="dim" x="210" y="92" text-anchor="middle">20 cm</text>

  <!-- kaki 10 cm (kiri dan kanan) -->
  <text class="dim" x="76" y="150" text-anchor="end">10 cm</text>
  <text class="dim" x="344" y="150" text-anchor="start">10 cm</text>
</svg>
