<svg xmlns="http://www.w3.org/2000/svg" width="420" height="262" viewBox="0 0 420 262">
  <!-- 1-kuantitatif-023: taman 20 m x 12 m, kolam persegi sisi 6 m. Skala 16 px per meter.
       Hanya besaran yang DIKETAHUI pada soal yang diberi label. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .dim  { font-size: 14px; font-weight: 600; fill: #3f4650; }
    .note { font-size: 13px; fill: #6b7280; }
    .tick { stroke: #6b7280; stroke-width: 1; }
  </style>

  <rect x="65" y="24" width="320" height="192" fill="#eaf4ec" stroke="#1a5fb4" stroke-width="2"/>
  <rect x="235" y="96" width="96" height="96" fill="#d6e4fa" stroke="#1a5fb4" stroke-width="2"/>

  <text class="note" x="120" y="60">rumput</text>
  <text class="note" x="283" y="149" text-anchor="middle">kolam</text>

  <!-- sisi panjang 20 m -->
  <line class="tick" x1="65" y1="232" x2="385" y2="232"/>
  <line class="tick" x1="65" y1="226" x2="65" y2="238"/>
  <line class="tick" x1="385" y1="226" x2="385" y2="238"/>
  <text class="dim" x="225" y="254" text-anchor="middle">20 m</text>

  <!-- sisi lebar 12 m -->
  <line class="tick" x1="48" y1="24" x2="48" y2="216"/>
  <line class="tick" x1="42" y1="24" x2="54" y2="24"/>
  <line class="tick" x1="42" y1="216" x2="54" y2="216"/>
  <text class="dim" x="32" y="120" text-anchor="middle" transform="rotate(-90 32 120)">12 m</text>

  <!-- sisi kolam 6 m -->
  <line class="tick" x1="235" y1="86" x2="331" y2="86"/>
  <line class="tick" x1="235" y1="80" x2="235" y2="92"/>
  <line class="tick" x1="331" y1="80" x2="331" y2="92"/>
  <text class="dim" x="283" y="76" text-anchor="middle">6 m</text>
</svg>
