<svg xmlns="http://www.w3.org/2000/svg" width="330" height="250" viewBox="0 0 330 250">
  <!-- 2-kuantitatif-025: taman berbentuk juring, sudut pusat 60°, jari-jari 21 m.
       Skala ~7,14 px per meter (r = 150 px). Seluruh tepi (busur + dua jari-jari)
       adalah bagian yang dipagari, digambar sebagai garis tebal.
       Panjang busur TIDAK dilabeli — itu yang harus dihitung. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .dim  { font-size: 14px; font-weight: 600; fill: #3f4650; }
    .note { font-size: 13px; fill: #6b7280; }
  </style>

  <path d="M 90 200 L 240 200 A 150 150 0 0 0 165 70.1 Z"
        fill="#d6e4fa" stroke="#1a5fb4" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- sudut pusat 60° -->
  <path d="M 124 200 A 34 34 0 0 0 107 170.6" fill="none" stroke="#3f4650" stroke-width="1.2"/>
  <text class="dim" x="139" y="182">60°</text>

  <circle cx="90" cy="200" r="3" fill="#3f4650"/>
  <text class="note" x="176" y="152" text-anchor="middle">taman</text>

  <!-- jari-jari 21 m -->
  <text class="dim" x="165" y="222" text-anchor="middle">21 m</text>
  <text class="dim" x="103" y="120" text-anchor="end">21 m</text>
</svg>
