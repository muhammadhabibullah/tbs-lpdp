name: PR Check

on:
  pull_request:
    branches: [master]
    paths:
      - 'questions/**'
      - '.github/workflows/**'

jobs:
  validate-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r questions/generator/requirements.txt

      - name: Validate question bank
        run: python3 questions/generator/validate_bank.py
