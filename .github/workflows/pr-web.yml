name: PR Check (web & supabase)

on:
  pull_request:
    branches: [master]
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/pr-web.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
