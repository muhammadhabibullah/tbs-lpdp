name: Release offline app

# v6 AP-8. Tag the release with the version already committed in
# web/src-tauri/tauri.conf.json:
#
#   git tag app-v0.1.0 && git push origin app-v0.1.0
#
# The desktop matrix creates one DRAFT GitHub Release holding every installer,
# its minisign signature, and latest.json; the Android job signs an APK and
# uploads it into the same draft. Once both jobs complete, the publish job
# automatically publishes the release.
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail in ten seconds rather than after a 40-minute matrix.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        name: Tag must match tauri.conf.json, updater key must be configured
        env:
          # Through the environment, so the secret never becomes script text.
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./web/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$TAG" != "app-v$VERSION" ]; then
            echo "::error::tag '$TAG' does not match tauri.conf.json version '$VERSION' (expected app-v$VERSION)"
            exit 1
          fi

          PUBKEY=$(node -p "require('./web/src-tauri/tauri.conf.json').plugins.updater.pubkey")
          if [ -z "$PUBKEY" ] || [ "${PUBKEY#REPLACE_WITH}" != "$PUBKEY" ]; then
            echo "::error::plugins.updater.pubkey is still a placeholder — run the one-time setup in docs/TECHNICAL_REQUIREMENTS_V6.md §5"
            exit 1
          fi
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set (C-30)"
            exit 1
          fi

  desktop:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # 22.04 links against an older glibc, so the AppImage runs on more
          # distributions than one built on the newest runner would.
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          # NF-32: question versions come from commit history, so the bank
          # snapshot compiled into the installer needs the full log.
          fetch-depth: 0

      # Tauri v2's own list. `libappindicator3-dev` is deliberately absent: it
      # is the pre-Ayatana package and conflicts with
      # `libayatana-appindicator3-dev`, so asking for both leaves apt with
      # nothing it can install.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libxdo-dev libssl-dev patchelf \
            build-essential curl wget file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
          key: ${{ matrix.rust-target }}

      - run: npm ci
        working-directory: web

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # C-30: signing material exists only here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          tagName: app-v${{ needs.guard.outputs.version }}
          releaseName: TBS LPDP Try Out v${{ needs.guard.outputs.version }}
          # FE-42: the install steps live here rather than on the home page.
          # They are read only by someone who has already downloaded a file,
          # and here they are versioned with the installers they describe.
          #
          # GitHub renders release notes with hard line breaks on, so each
          # paragraph and each list item is one source line however long —
          # wrapping it here would wrap it on the page too.
          releaseBody: |
            Aplikasi try out TBS LPDP yang berjalan **sepenuhnya offline** — seluruh bank soal ada di dalam aplikasi, tanpa akun dan tanpa iklan. Saat perangkat terhubung ke internet, aplikasi memeriksa paket soal baru secara otomatis.

            Unduh berkas yang sesuai dari daftar **Assets** di bawah, lalu ikuti petunjuk pemasangan untuk sistem operasi Anda.

            > Aplikasi ini **belum bertanda tangan digital berbayar** karena merupakan proyek gratis dan terbuka, sehingga Windows dan macOS menampilkan peringatan saat pertama dipasang. Itu bukan tanda bahwa aplikasi berbahaya — kode sumbernya terbuka dan dapat Anda periksa sendiri. Pastikan Anda hanya mengunduh dari repositori ini.

            ## 🪟 Windows 10 / 11 (64-bit)

            1. Unduh berkas `…-setup.exe`, lalu klik dua kali berkas hasil unduhan.
            2. Jika muncul layar biru **"Windows protected your PC"**, klik **More info** lalu **Run anyway**.
            3. Ikuti langkah pemasang sampai selesai.
            4. Aplikasi muncul di **Start Menu** dengan nama **TBS LPDP Try Out**.

            ## 🍎 macOS (Apple Silicon & Intel)

            1. Unduh berkas `.dmg` sesuai jenis prosesor Mac Anda —  → **About This Mac**. Chip **Apple M1/M2/M3** memakai berkas `aarch64`, prosesor **Intel** memakai `x64`.
            2. Buka berkas tersebut, lalu seret ikon aplikasi ke folder **Applications**.
            3. Saat pertama dibuka, macOS menahan aplikasi yang tidak bersertifikat berbayar Apple. Buka **System Settings → Privacy & Security**, gulir ke bawah, lalu klik **Open Anyway**. Pada macOS 14 ke bawah, klik kanan ikon aplikasi → **Open** juga bisa.
            4. Jika muncul pesan **"… is damaged and can't be opened"**, itu penanda karantina unduhan — berkasnya tidak rusak. Buka **Terminal**, jalankan perintah berikut, lalu buka lagi aplikasinya:

               ```
               xattr -cr "/Applications/TBS LPDP Try Out.app"
               ```

            ## 🐧 Linux (x86-64)

            1. Unduh berkas `.AppImage`.
            2. Klik kanan berkas → **Properties** → centang **Executable**, atau jalankan `chmod +x nama-berkas.AppImage` di terminal.
            3. Klik dua kali berkas tersebut untuk menjalankan aplikasi.
            4. Pengguna Debian/Ubuntu dapat memakai berkas `.deb`, dan Fedora `.rpm`. Perlu dicatat: **pembaruan otomatis hanya tersedia pada AppImage**; paket `.deb`/`.rpm` harus diperbarui manual.

            ## 🤖 Android 7.0 ke atas (arm64)

            1. Unduh berkas `.apk` langsung di perangkat Android Anda.
            2. Buka berkas hasil unduhan — dari notifikasi unduhan atau aplikasi **Files**.
            3. Saat diminta, izinkan **"Install unknown apps"** / **"Instal dari sumber tidak dikenal"** untuk browser yang Anda pakai, lalu kembali dan tekan **Install**.
            4. Pembaruan cukup dengan memasang APK versi baru di atas yang lama — riwayat dan jawaban Anda tetap tersimpan.

            ---

            Versi web: https://muhammadhabibullah.github.io/tbs-lpdp/ · Laporan bug dan masukan: <muhammadhabibullah.id@gmail.com>
          releaseDraft: true
          prerelease: false
          # AP-6: publishes latest.json alongside the signed installers.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  android:
    # The desktop matrix owns the release; this job only adds the APK to it.
    needs: [guard]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018'

      # `${{ env.X }}` only reads env blocks declared in this workflow, not the
      # runner's own environment, so ANDROID_HOME has to be expanded by the
      # shell. Publishing NDK_HOME here keeps the later steps declarative.
      - name: Locate the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
          key: android

      - run: npm ci
        working-directory: web

      # `gen/android` is generated output and is not committed, so the Gradle
      # project — including the signing patch below — is rebuilt every run.
      - name: Initialise the Android project
        working-directory: web
        run: npx tauri android init --ci

      # `tauri android init` seeds gen/android with the Tauri CLI's own
      # placeholder launcher icons and never looks at src-tauri/icons, so
      # without this step the APK ships the Tauri logo. `tauri icon` writes
      # straight into gen/android/app/src/main/res once that project exists,
      # which it now does — order matters.
      - name: Brand the launcher icons
        working-directory: web
        run: |
          set -euo pipefail
          npm run app:icons
          # The template ships no adaptive-icon descriptor, so this file exists
          # only if `tauri icon` really wrote into the Gradle project. Catching
          # a silent no-op here beats discovering it on a published APK.
          RES=src-tauri/gen/android/app/src/main/res
          if [ ! -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            echo "::error::launcher icons were not written to gen/android — the APK would ship the Tauri logo"
            exit 1
          fi

      - name: Configure release signing (C-30)
        working-directory: web
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64}" ]; then
            echo "::error::secret ANDROID_KEYSTORE_B64 is not set (v6 §5 step 2)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > src-tauri/gen/android/release.jks
          # printf, not a heredoc: the arguments are written verbatim, so a
          # password containing `$` or a backtick cannot be re-expanded.
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\npassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > src-tauri/gen/android/keystore.properties
          node scripts/patch-android-signing.ts

      - name: Build the APK
        working-directory: web
        run: npx tauri android build --apk --target aarch64

      - name: Verify the signature and rename the artifact
        id: apk
        working-directory: web
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::no signed release APK was produced"
            find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' || true
            exit 1
          fi
          # AP-7: an unsigned or differently-signed APK cannot install over the
          # previous version, which would silently break every upgrade.
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$APK"
          OUT="tbs-lpdp-try-out_${{ needs.guard.outputs.version }}_arm64.apk"
          cp "$APK" "$OUT"
          echo "path=web/$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload the APK into the same release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "app-v${{ needs.guard.outputs.version }}" "${{ steps.apk.outputs.path }}" --clobber

  publish:
    # Automatically publish the release once all desktop installers and the Android APK are uploaded.
    needs: [guard, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "app-v${{ needs.guard.outputs.version }}" --draft=false --repo "${{ github.repository }}"

